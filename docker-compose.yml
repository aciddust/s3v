services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: s3v-rustfs
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web Console
    environment:
      - RUSTFS_VOLUMES=/data/rustfs{0...3}
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_OBS_LOGGER_LEVEL=info
      - RUSTFS_OBJECT_CACHE_ENABLE=true
      - RUSTFS_OBJECT_CACHE_TTL_SECS=300
    volumes:
      - rustfs_data_0:/data/rustfs0
      - rustfs_data_1:/data/rustfs1
      - rustfs_data_2:/data/rustfs2
      - rustfs_data_3:/data/rustfs3
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD", "sh", "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  volume-permission-helper:
    image: alpine
    volumes:
      - rustfs_data_0:/data0
      - rustfs_data_1:/data1
      - rustfs_data_2:/data2
      - rustfs_data_3:/data3
    command: >
      sh -c "chown -R 10001:10001 /data0 /data1 /data2 /data3 && exit 0"
    restart: "no"

  # Seed test data after rustfs starts
  rustfs-seed:
    image: minio/mc
    container_name: s3v-rustfs-seed
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://rustfs:9000 rustfsadmin rustfsadmin

        # Create buckets
        mc mb --ignore-existing local/test-small
        mc mb --ignore-existing local/test-large
        mc mb --ignore-existing local/test-nested

        # test-small: a few files
        for i in $(seq 1 10); do
          echo "content $i" | mc pipe local/test-small/file-$(printf '%03d' $i).txt
        done

        # test-large: 2500 files (tests pagination at 1000/page)
        for i in $(seq 1 2500); do
          echo "content $i" | mc pipe local/test-large/file-$(printf '%05d' $i).txt
        done

        # test-nested: folder hierarchy
        for dir in photos docs docs/reports videos; do
          for i in $(seq 1 5); do
            echo "content" | mc pipe local/test-nested/$dir/item-$i.txt
          done
        done

        echo "=== Seed complete ==="

volumes:
  rustfs_data_0:
  rustfs_data_1:
  rustfs_data_2:
  rustfs_data_3:
