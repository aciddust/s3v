[package]
name = "s3v"
version = "0.4.6"
description = "S3-compatible storage client"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "s3v_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"] }
aws-sdk-s3 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-smithy-types = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
aes-gcm = "0.10"
base64 = "0.22"
tauri-plugin-dialog = "2.7.0"
urlencoding = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2"
reqwest = { version = "0.13.2", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString", "NSURL", "NSArray", "NSError", "NSThread",
    "NSDictionary", "NSObject",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSFilePromiseProvider", "NSDraggingItem", "NSDraggingSession",
    "NSView", "NSWindow", "NSApplication", "NSEvent", "NSImage",
    "NSPasteboard", "NSDragging", "NSWorkspace", "NSResponder",
    "block2",
] }
block2 = "0.6"

[patch.crates-io]
wry = { path = "patches/wry" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
